<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ArtLocal — See it. Buy it. Keep it Local.</title>
    <link rel="manifest" href="/static/manifest.json">
    <meta name="theme-color" content="#1a1a2e">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎨</text></svg>">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <!-- ── Top Bar ──────────────────────────────────────────── -->
    <header id="topbar">
        <div class="topbar-left">
            <h1 class="logo">🎨 ArtLocal</h1>
        </div>
        <div class="topbar-center">
            <input type="text" id="search-input" placeholder="Search art near you...">
        </div>
        <div class="topbar-right">
            <button id="location-btn" title="Update location">📍</button>
            <button id="auth-btn">Sign In</button>
        </div>
    </header>

    <!-- ── Main Content ─────────────────────────────────────── -->
    <main id="feed-view">
        <div class="feed-status">
            <span id="location-status">📍 Getting your location...</span>
            <span id="listing-count"></span>
        </div>
        <div id="masonry-grid" class="masonry"></div>
        <div id="empty-state" class="empty-state hidden">
            <p>🖼️ No art found nearby.</p>
            <p>Be the first to post!</p>
        </div>
    </main>

    <!-- ── Listing Detail Modal ─────────────────────────────── -->
    <div id="detail-modal" class="modal hidden">
        <div class="modal-content detail-content">
            <button class="modal-close" onclick="closeModal('detail-modal')">&times;</button>
            <img id="detail-image" src="" alt="">
            <div class="detail-info">
                <h2 id="detail-title"></h2>
                <p class="detail-price" id="detail-price"></p>
                <p class="detail-meta" id="detail-meta"></p>
                <p class="detail-desc" id="detail-desc"></p>
                <p class="detail-artist" id="detail-artist"></p>
                <p class="detail-distance" id="detail-distance"></p>
            </div>
        </div>
    </div>

    <!-- ── Auth Modal ───────────────────────────────────────── -->
    <div id="auth-modal" class="modal hidden">
        <div class="modal-content auth-content">
            <button class="modal-close" onclick="closeModal('auth-modal')">&times;</button>
            <h2 id="auth-title">Sign In</h2>
            <form id="auth-form">
                <div id="signup-fields" class="hidden">
                    <input type="text" id="auth-username" placeholder="Username">
                    <input type="text" id="auth-displayname" placeholder="Display Name">
                    <label class="checkbox-label">
                        <input type="checkbox" id="auth-is-artist"> I'm an artist
                    </label>
                </div>
                <input type="email" id="auth-email" placeholder="Email" required>
                <input type="password" id="auth-password" placeholder="Password" required>
                <button type="submit" id="auth-submit">Sign In</button>
            </form>
            <p class="auth-toggle">
                <span id="auth-toggle-text">Don't have an account?</span>
                <a href="#" id="auth-toggle-link">Sign Up</a>
            </p>
        </div>
    </div>

    <!-- ── Post Listing Modal ───────────────────────────────── -->
    <div id="post-modal" class="modal hidden">
        <div class="modal-content post-content">
            <button class="modal-close" onclick="closeModal('post-modal')">&times;</button>
            <h2>Post Artwork</h2>
            <form id="post-form">
                <div class="upload-area" id="upload-area">
                    <input type="file" id="post-image" accept="image/*" capture="environment" required>
                    <p>📷 Tap to add a photo</p>
                    <img id="upload-preview" class="hidden" src="" alt="Preview">
                </div>
                <input type="text" id="post-title" placeholder="Title" required>
                <input type="number" id="post-price" placeholder="Price ($)" step="0.01" min="0" required>
                <select id="post-medium">
                    <option value="">Select Medium...</option>
                    <option value="Oil">Oil</option>
                    <option value="Acrylic">Acrylic</option>
                    <option value="Watercolor">Watercolor</option>
                    <option value="Digital">Digital</option>
                    <option value="Photography">Photography</option>
                    <option value="Sculpture">Sculpture</option>
                    <option value="Mixed Media">Mixed Media</option>
                    <option value="Print">Print</option>
                    <option value="Other">Other</option>
                </select>
                <input type="text" id="post-dimensions" placeholder="Dimensions (e.g. 24x36 in)">
                <textarea id="post-description" placeholder="Description (optional)" rows="3"></textarea>
                <button type="submit" id="post-submit">🎨 Post It</button>
            </form>
        </div>
    </div>

    <!-- ── Bottom Nav ───────────────────────────────────────── -->
    <nav id="bottom-nav">
        <button class="nav-btn active" data-view="feed">🏠<span>Home</span></button>
        <button class="nav-btn" data-view="search">🔍<span>Search</span></button>
        <button class="nav-btn post-btn" data-view="post">➕<span>Post</span></button>
        <button class="nav-btn" data-view="profile">👤<span>Profile</span></button>
    </nav>

    <script src="/static/app.js"></script>
</body>
</html>
